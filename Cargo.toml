[package]
name = "merkle-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Merkle tree and sparse Merkle tree library for data integrity, incremental hashing, and distributed data sync. Pluggable hash algorithms, proof generation and verification, tree diffing, and serializable proofs."

keywords = [
    "merkle",
    "hash-tree",
    "integrity",
    "proof",
    "rust"
]

categories = [
    "data-structures",
    "cryptography"
]

documentation = "https://docs.rs/merkle-lib"
repository    = "https://github.com/jamesgober/merkle-lib"
homepage      = "https://github.com/jamesgober/merkle-lib"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "merkle_lib"
path = "src/lib.rs"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true